<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TubeFolio2 履歴・分析</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="wrap">
  <h1>★ TubeFolio2</h1>
  <div class="tabs">
    <button data-tab="history" class="on">視聴履歴</button>
    <button data-tab="analytics">分析</button>
    <button id="openOpts" style="margin-left:auto">⚙ 設定</button>
  </div>
  <div class="row">
    <label>期間
      <select id="range">
        <option value="7">7日</option><option value="30" selected>30日</option>
        <option value="90">90日</option><option value="0">すべて</option>
      </select>
    </label>
  </div>

  <section id="history">
    <div class="row">
      <input type="text" id="hq" placeholder="タイトル・チャンネルで検索" style="flex:1;min-width:200px">
      <button class="btn" id="export">JSON書き出し</button>
      <button class="btn danger" id="clear">履歴を全削除</button>
    </div>
    <div id="hlist" class="card"></div>
  </section>

  <section id="analytics" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="card"><h2>日別の視聴時間(分)</h2><div class="bars" id="byDay"></div></div>
    <div class="grid2">
      <div class="card"><h2>時間帯別(分)</h2><div class="bars" id="byHour"></div></div>
      <div class="card"><h2>曜日別(分)</h2><div class="bars" id="byWeek"></div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>よく見るチャンネル(視聴時間)</h2><div id="topCh"></div></div>
      <div class="card"><h2>よく見る動画(視聴時間)</h2><div id="topVid"></div></div>
    </div>
    <div class="card"><h2>お気に入りのグループ別内訳</h2><div id="byGroup"></div></div>
  </section>
</div>
<script src="store.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
