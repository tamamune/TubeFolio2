<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動作ログ - TubeFolio2</title>
<link rel="stylesheet" href="log.css">
</head>
<body>
  <header class="top">
    <h1>📜 動作ログ</h1>
    <span class="muted" id="sum"></span>
    <span class="sp"></span>
    <button class="small" id="copy">テキストでコピー</button>
    <button class="danger" id="clear">ログを消去</button>
  </header>
  <main>
    <section class="card">
      <div class="lg-tools">
        <div class="seg" id="lv"><button data-l="all" class="on">すべて</button><button data-l="warn">注意・エラーだけ</button></div>
        <input type="search" id="q" placeholder="ログを検索">
        <div class="chips" id="cats"></div>
      </div>
      <div class="log" id="log"></div>
      <button id="more" class="more" hidden>もっと見る</button>
      <p id="empty" class="empty" hidden>まだログはありません。</p>
    </section>
    <footer class="foot"><span class="muted">TubeFolio2 がバックグラウンドで行ったこと(Drive同期・登録チャンネルの取り込み・新着の取得・再生リストへの追加など)と、YouTubeのタブでの動作を記録しています。この端末だけに保存され、Drive同期の対象外です(最新2000件)。</span></footer>
  </main>
  <script src="ui-sync.js"></script>
<script src="theme.js"></script>
  <script src="log.js"></script>
</body>
</html>
