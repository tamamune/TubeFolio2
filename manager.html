<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TubeFolio2 グループ管理</title>
<script src="ui-sync.js"></script>
<script src="theme.js"></script>
<link rel="stylesheet" href="manager.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">▶</span><div><b>TubeFolio2</b><small>登録チャンネル管理</small></div></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <nav class="gbar" id="gbar">
      <div class="gtitle"><b id="ttl"></b><small id="sub"></small></div>
      <span id="drvst" class="gdrv"></span>
      <button class="btn pri" id="ytimp">⟳ YouTubeから取り込む</button>
      <span class="gspace"></span>
      <button id="bulkAssist" class="gpill" hidden></button>
      <button id="assistCfg" class="gpill" hidden title="振り分け補助の設定(点数・キーワード)">⚙</button>
      <button id="assistBtn" class="gpill" hidden title="フォルダに入っていないチャンネルに、フォルダの候補を出します(キーワードは、フォルダの編集で設定)">🪄 振り分け補助</button>
      <button id="statsTgl" class="gpill" title="投稿情報">📊 投稿情報</button>
      <div class="search gsearch"><span>🔍</span><input id="q" placeholder="チャンネルを検索"></div>
      <span class="gtools">
        <button data-g="menu" id="gmenu" title="チャンネル管理の設定"><img src="gear.png" alt="設定" width="24" height="24"></button>
        <input type="file" id="gfile" accept=".json,application/json" hidden>
      </span>
    </nav>
    <header hidden></header>
    <div id="bulk" class="bulk" hidden>
      <b id="bcnt"></b>
      <div id="bgroups"></div>
      <button id="bclr">選択解除</button>
    </div>
    <p id="howto" class="howto">フォルダへの登録: チャンネルの「📁 フォルダ」を押して、入れたいフォルダにチェックを付けます(1つのチャンネルを、いくつものフォルダに入れられます)。まとめて入れるときは、カードを押して選んでから「📁 フォルダを選ぶ」。左のフォルダへドラッグしても入ります。</p>
    <section id="grid" class="grid"></section>
    <div id="empty" class="empty" hidden></div>
    <section id="chview" hidden></section>
  </main>
</div>
<dialog id="dlg">
  <form method="dialog" id="gform">
    <h2 id="dtitle">グループ</h2>
    <label>名前<input id="gname" maxlength="30" required></label>
    <label>親フォルダ<select id="gparent"></select></label>
    <label>キーワード(再生画面のタグから、このフォルダを提案するための言葉。「,」区切り・「-言葉」で除外。空欄ならフォルダ名から自動)<input id="gkw" placeholder="グルメ, ラーメン, -ゲーム"></label>
    <label>アイコン</label><div id="icons" class="icons"></div>
    <div class="gimgrow"><input id="gimg" placeholder="外部画像のURL (https://…)"><button type="button" id="gimgfile">画像ファイル</button><input type="file" id="gimgf" accept="image/*" hidden><span id="gprev"></span></div>
    <label>色</label><div id="colors" class="colors"></div>
    <div class="dact"><button type="button" id="gdel" class="danger">削除</button><span></span>
      <button type="button" id="gcancel">キャンセル</button><button class="pri" value="ok">保存</button></div>
  </form>
</dialog>
<div id="hv" hidden></div>
<div id="toast"></div>
<script src="store.js"></script>
<script src="manager.js"></script>
</body>
</html>
