<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TubeFolio2 グループ管理</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="manager.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">▶</span><div><b>TubeFolio2</b><small>登録チャンネル管理</small></div></div>
    <nav id="nav"></nav>
    <button class="add" id="addGroup">＋ グループを作成</button>
    <div class="foot">
      <button id="theme" class="th" title="テーマ切替"></button>
      <button id="exp">⬇ バックアップ</button>
      <button id="imp">⬆ 復元</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </aside>
  <main>
    <header>
      <div class="title"><h1 id="ttl"></h1><p id="sub"></p></div>
      <div class="tools">
        <div class="search"><span>🔍</span><input id="q" placeholder="チャンネルを検索"></div>
        <select id="sort"><option value="added">追加順</option><option value="name">名前順 (A-Z)</option></select>
        <a class="btn pri" href="https://www.youtube.com/feed/channels?tf_import=1" target="_blank">⟳ YouTubeから取り込む</a>
      </div>
    </header>
    <div id="bulk" class="bulk" hidden>
      <b id="bcnt"></b>
      <div id="bgroups"></div>
      <button id="bclr">選択解除</button>
    </div>
    <section id="stats" class="stats"></section>
    <section id="grid" class="grid"></section>
    <div id="empty" class="empty" hidden></div>
  </main>
</div>
<dialog id="dlg">
  <form method="dialog" id="gform">
    <h2 id="dtitle">グループ</h2>
    <label>名前<input id="gname" maxlength="30" required></label>
    <label>親フォルダ<select id="gparent"></select></label>
    <label>アイコン</label><div id="icons" class="icons"></div>
    <label>色</label><div id="colors" class="colors"></div>
    <div class="dact"><button type="button" id="gdel" class="danger">削除</button><span></span>
      <button type="button" id="gcancel">キャンセル</button><button class="pri" value="ok">保存</button></div>
  </form>
</dialog>
<div id="hv" hidden></div>
<div id="toast"></div>
<script src="store.js"></script>
<script src="manager.js"></script>
</body>
</html>
